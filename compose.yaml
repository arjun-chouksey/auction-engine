services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-british_auction}
      POSTGRES_USER: ${POSTGRES_USER:-auction}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-auction_local_only}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./backend/testdata/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro

  api:
    build:
      context: ./backend
    environment:
      APP_PORT: ${APP_PORT:-8080}
      DATABASE_URL: ${DATABASE_URL:-postgres://auction:auction_local_only@db:5432/british_auction?sslmode=disable}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-AuctionDemo2026!}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
    ports:
      - "${API_HOST_PORT:-8080}:${APP_PORT:-8080}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/server", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  ui:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

  migrate:
    image: migrate/migrate:v4.20.1
    profiles: ["tools"]
    volumes:
      - ./backend/migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy

  integration-test:
    build:
      context: ./backend
      target: integration-test
    profiles: ["tools"]
    environment:
      DATABASE_TEST_URL: ${DATABASE_TEST_URL_COMPOSE:-postgres://auction:auction_local_only@db:5432/british_auction_test?sslmode=disable}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:

